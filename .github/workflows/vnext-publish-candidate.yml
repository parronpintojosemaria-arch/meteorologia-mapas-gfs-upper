name: vNext · Candidato Pages · GFS upper · 1.548 mapas

# visual-2: paletas HD profesionales · 2026-09-18
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vnext-publish-candidate.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-gfs-upper-candidate
  cancel-in-progress: false

jobs:
  build:
    name: Generar y validar GFS upper HD
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar generadores
        working-directory: backend
        run: |
          python -m py_compile scripts/vnext_gfs_generate.py
          python -m py_compile scripts/vnext_gfs_preflight.py
          python -m py_compile scripts/vnext_current_guard.py

      - id: cycle
        name: Sincronizar ciclo con GFS surface
        shell: bash
        run: |
          set -euo pipefail
          CYCLE=$(python -c "import json, urllib.request as u; d=json.load(u.urlopen('https://parronpintojosemaria-arch.github.io/meteorologia-mapas-gfs-surface/current.json', timeout=30)); assert d.get('status') == 'ready', d; assert d.get('model') == 'gfs-surface', d; assert int(d.get('file_count', 0)) == 2058, d; c=d.get('cycle'); assert isinstance(c, str) and c, d; print(c)")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
          echo "GFS upper sincronizado con surface: $CYCLE"

      - name: Generar 1.548 mapas upper · España 2400 · Europa 2800 · q92
        working-directory: backend
        timeout-minutes: 330
        run: python scripts/vnext_gfs_generate.py upper --cycle "$CYCLE"

      - name: Construir manifest del shard y validar todos los archivos
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image

          cycle=os.environ['CYCLE']
          root=Path('vnext-full-out/gfs/cycles')/cycle
          frag=root/'fragment-upper.json'
          d=json.loads(frag.read_text(encoding='utf-8'))
          assert d['status']=='ready'
          assert d['group']=='upper'
          assert d['expected_count']==1548
          assert len(d['files'])==1548
          assert d['cycle']==cycle
          widths={'spain':2400,'europe':2800}
          total=0
          for row in d['files']:
              p=root/row['path']
              assert p.is_file() and p.stat().st_size>100
              assert row['width']==widths[row['domain']]
              assert row['height']>900
              total += p.stat().st_size
          for row in (d['files'][0], d['files'][len(d['files'])//2], d['files'][-1]):
              with Image.open(root/row['path']) as im:
                  im.verify()
          mib=total/(1024*1024)
          assert mib < 940.0, f'GFS upper supera guard Pages: {mib:.2f} MiB'
          manifest=dict(d)
          manifest['schema']='vnext-gfs-shard-1'
          manifest['publication_role']='gfs-upper-shard'
          manifest['production_changed']=False
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'GFS UPPER SHARD OK · 1548 mapas · {mib:.2f} MiB · ciclo {cycle}')
          PY

      - name: Preparar sitio candidato
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "../site/cycles/$CYCLE"
          cp -a "vnext-full-out/gfs/cycles/$CYCLE/." "../site/cycles/$CYCLE/"
          python scripts/vnext_current_guard.py \
            --model gfs-upper \
            --cycle "$CYCLE" \
            --cycle-dir "vnext-full-out/gfs/cycles/$CYCLE" \
            --base-url 'https://parronpintojosemaria-arch.github.io/meteorologia-mapas-gfs-upper' \
            --output ../site/current.json
          cat > ../site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Meteorología Interactiva · GFS upper</title>
          <h1>Meteorología Interactiva · GFS upper</h1>
          <p>Candidato vNext HD. Datos: NOAA/NCEP GFS. Niveles 300/250/200 hPa y Jet 300/250/200 hPa.</p>
          <p><a href="current.json">current.json</a></p>
          HTML
          touch ../site/.nojekyll

      - name: Guard final candidato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('site/current.json').read_text())
          assert c['status']=='ready' and c['model']=='gfs-upper' and c['file_count']==1548
          assert Path('site/cycles',c['cycle'],'manifest.json').is_file()
          print('CURRENT CANDIDATO GFS UPPER OK',c['cycle'],c['file_count'])
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar candidato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Publicar candidato aislado GFS upper
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4
